global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # Services run as jars on the host during development, so Prometheus reaches them through the
  # gateway alias rather than a container name. Swap these for the service names when running the
  # whole stack from docker-compose.images.yml.
  - job_name: order-platform
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels: { service: order-service }
      - targets: ["host.docker.internal:8082"]
        labels: { service: inventory-service }
      - targets: ["host.docker.internal:8083"]
        labels: { service: payment-service }
      - targets: ["host.docker.internal:8084"]
        labels: { service: shipping-service }
      - targets: ["host.docker.internal:8085"]
        labels: { service: notification-service }
      - targets: ["host.docker.internal:8086"]
        labels: { service: analytics-service }
