spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/inventory_service
    username: ${POSTGRES_USER:platform}
    password: ${POSTGRES_PASSWORD:platform}
    hikari:
      maximum-pool-size: 16

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/inventory

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wrapping the JSON deserializer means a malformed record surfaces as a failed record the
      # error handler can dead-letter. Deserializing directly throws inside the poll loop, where
      # nothing can recover it and the container spins on the same offset forever.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      enable-auto-commit: false
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: io.github.evelynkk.orderplatform.events
    listener:
      ack-mode: record

platform:
  outbox:
    poll-interval-ms: 200
    batch-size: 200

  dlq:
    topic: order.events.dlq
    initial-backoff-ms: 500
    backoff-multiplier: 2.0
    max-backoff-ms: 8000
    max-retries: 4

server:
  port: 8082

logging:
  level:
    io.github.evelynkk.orderplatform: INFO
