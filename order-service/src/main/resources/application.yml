spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/order_service
    username: ${POSTGRES_USER:platform}
    password: ${POSTGRES_PASSWORD:platform}
    hikari:
      # The listener container threads and the outbox relay all draw from this pool; sizing it
      # below the number of concurrent consumers would make them queue on connections.
      # Must exceed the listener threads plus the relay, or handlers queue on
      # connections and the extra consumer parallelism is wasted.
      maximum-pool-size: 32

  jpa:
    # Flyway owns the schema. Hibernate only checks that the mapping still matches it, so a
    # forgotten migration fails at startup instead of at the first write.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true

  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/order

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wrapping the JSON deserializer means a malformed record surfaces as a failed record the
      # error handler can dead-letter. Deserializing directly throws inside the poll loop, where
      # nothing can recover it and the container spins on the same offset forever.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      # Offsets are committed by the container after the handler returns, not by a background
      # timer, so a crash mid-handler replays the record rather than skipping it.
      enable-auto-commit: false
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: io.github.evelynkk.orderplatform.events
    listener:
      ack-mode: record
      # Three threads per listener, not the six that would match the partition count. Matching
      # partitions is the textbook move, but every service multiplies it by its listener count, and
      # oversubscribing the CPU costs more than the extra parallelism returns.
      concurrency: 3
      # Emits a per-listener timer, which is what separates "the broker is slow" from
      # "our handler is slow" when end-to-end latency rises.
      observation-enabled: true

platform:
  outbox:
    # The saga crosses the outbox four times, so each tick of this interval is paid four times
    # over in end-to-end latency.
    poll-interval-ms: 50
    batch-size: 500
    linger-ms: 5
    batch-size-bytes: 65536

  dlq:
    topic: order.events.dlq
    initial-backoff-ms: 500
    backoff-multiplier: 2.0
    max-backoff-ms: 8000
    max-retries: 4

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      # Every series is labelled with its origin, so one Grafana panel can break a platform-wide
      # metric down per service without a query per service.
      service: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

server:
  port: 8081

logging:
  level:
    io.github.evelynkk.orderplatform: INFO
